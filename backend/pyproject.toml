[project]
name = "atlas-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the Atlas user story agents (To author → To refine → To specify)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "langgraph>=0.6",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3.60",
  "langchain-openai>=0.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
